[package]
name = "vfield"
version = "0.1.0"
edition = "2021"
default-run = "vfield"
description = "Vector-field puzzle game: Position, Predict, Tempo, Experiment"
publish = false

[lib]
name = "vfield"
path = "src/lib.rs"

[[bin]]
name = "vfield"
path = "src/main.rs"

[[bin]]
name = "report"
path = "src/bin/report.rs"

[[bin]]
name = "catalog"
path = "src/bin/catalog.rs"

[dependencies]
# Cargo.lock pins macroquad 0.4.13 / fontdue 0.9.2 (older toolchains); CI builds with --locked.
# default-features = false drops audio: no ALSA, and the web build needs only miniquad's gl.js.
macroquad = { version = "0.4", default-features = false }

[profile.dev]
opt-level = 2
