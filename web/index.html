<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vector Field</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0e1016; overflow: hidden; }
    canvas { display: block; width: 100vw; height: 100vh; outline: none; }
    #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
           color: #aab0c0; font: 18px monospace; pointer-events: none; }
  </style>
</head>
<body>
  <canvas id="glcanvas" tabindex="1"></canvas>
  <div id="msg">Loading...</div>
  <!-- Relative URLs so the page works under any GitHub Pages base path. -->
  <script src="gl.js"></script>
  <script>
    // The save: the game keeps its progress as one small text, and these three functions (imported by the wasm as
    // vf_storage_len / _read / _write, see src/storage.rs) keep it in this browser's localStorage. localStorage can
    // throw (private mode, storage blocked, quota), so every call is guarded: the game then runs without saving and
    // says so on its menu. START vf-storage
    (function () {
      var KEY = "vfield-save";
      var enc = new TextEncoder(), dec = new TextDecoder();
      function get() { try { return window.localStorage.getItem(KEY); } catch (e) { return null; } }
      miniquad_add_plugin({
        name: "vf_storage",
        version: "1",
        register_plugin: function (importObject) {
          importObject.env.vf_storage_len = function () {
            var s = get();
            return s === null ? -1 : enc.encode(s).length;
          };
          importObject.env.vf_storage_read = function (ptr, cap) {
            var s = get();
            if (s === null) return 0;
            var bytes = enc.encode(s);
            var n = Math.min(bytes.length, cap);
            new Uint8Array(wasm_memory.buffer, ptr, n).set(bytes.subarray(0, n));
            return n;
          };
          importObject.env.vf_storage_write = function (ptr, len) {
            try {
              window.localStorage.setItem(KEY, dec.decode(new Uint8Array(wasm_memory.buffer, ptr, len)));
              return 1;
            } catch (e) { return 0; }
          };
        }
      });
    })();
    // END vf-storage
  </script>
  <script>
    // miniquad's load() returns nothing (it is not a promise), so there is no .then to hang the
    // "Loading..." notice on. gl.js sets the global `wasm_exports` once the module is instantiated and
    // main() is running; the notice is removed on the first animation frame after that. If that never
    // happens, the notice says so instead of sitting over the playfield forever.
    var loadingMsg = document.getElementById("msg");
    function hideMsg() { if (loadingMsg) { loadingMsg.remove(); loadingMsg = null; } }
    load("vfield.wasm");
    var loadWaited = 0;
    var loadTimer = setInterval(function () {
      loadWaited += 100;
      if (typeof wasm_exports !== "undefined" && wasm_exports) {
        clearInterval(loadTimer);
        requestAnimationFrame(function () { requestAnimationFrame(hideMsg); });
      } else if (loadWaited >= 20000 && loadingMsg) {
        clearInterval(loadTimer);
        loadingMsg.style.color = "#e07a5f";
        loadingMsg.textContent = "The game did not start. Check the browser console for details.";
      }
    }, 100);
  </script>
</body>
</html>
