<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1420"/>
      <stop offset="1" stop-color="#171f30"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee3c9"/>
      <stop offset="1" stop-color="#ff8b6b"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- faint field lines -->
  <g stroke="#3a4a72" stroke-width="1.4" stroke-linecap="round" opacity="0.7">
    <line x1="10" y1="14" x2="16" y2="17"/>
    <line x1="10" y1="26" x2="17" y2="27"/>
    <line x1="10" y1="38" x2="18" y2="36"/>
    <line x1="46" y1="12" x2="53" y2="16"/>
    <line x1="44" y1="22" x2="52" y2="24"/>
    <line x1="42" y1="46" x2="49" y2="42"/>
    <line x1="30" y1="50" x2="37" y2="47"/>
  </g>
  <!-- drift line: start to target -->
  <path d="M9 46 C 20 46, 22 20, 34 18 S 50 20, 55 12"
        fill="none" stroke="url(#line)" stroke-width="3.4"
        stroke-linecap="round"/>
  <!-- start point -->
  <circle cx="9" cy="46" r="4" fill="#4ade80"/>
  <!-- target point -->
  <circle cx="55" cy="12" r="5" fill="#ff5d7a"/>
  <circle cx="55" cy="12" r="8.5" fill="none" stroke="#ff5d7a" stroke-width="1.6" opacity="0.5"/>
</svg>
