[package]
name = "peoplemodeler-app"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
dioxus = { version = "=0.7.10" }
peoplemodeler-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["web"]
web = ["dioxus/web"]
android = ["dioxus/mobile"]
ios = ["dioxus/mobile"]
