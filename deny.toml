[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Zlib",
]
private = { ignore = true }

[bans]
multiple-versions = "warn"

[advisories]
ignore = [
    "RUSTSEC-2025-0057",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2024-0370",
]
