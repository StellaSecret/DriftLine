# cargo-deny configuration: advisories (CVEs / yanked crates), license compliance, dependency sources.
# The allow-list below is the exact set of licenses present in the current dependency tree.

[graph]
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[advisories]
yanked = "deny"
ignore = [
    "RUSTSEC-2025-0035",
    "RUSTSEC-2026-0192",
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "0BSD",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
# The game itself is `publish = false` and carries no license yet.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
